name: scoped_di
description: Scoped Service Locator with Constructor Injections for Dart and Flutter. Fork of take_it with module dependencies support.
version: 2.0.0

repository: https://github.com/kuba-asanov/scoped_di
homepage: https://github.com/kuba-asanov/scoped_di
issue_tracker: https://github.com/kuba-asanov/scoped_di/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - di-framework
  - ioc
  - service-locator
  - dependency-injection
  - clean-architecture

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # For tests only
  get_it: 7.7.0
  equatable: ^2.0.8
